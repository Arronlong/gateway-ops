<header class="top"><strong>GatewayOps</strong><nav><a>首页</a><a>渠道管理</a><a>中转站管理</a><a>成本管理</a><a class="active">预警中心</a></nav></header>
<main><section class="title"><div><h1>预警中心</h1><p>规则触发、自动处置、消息通知与执行记录。</p></div><button class="primary">＋ 新建规则</button></section>
<section class="metrics"><article><label>待处理事件</label><b>3</b><small>未恢复预警</small></article><article><label>运行中规则</label><b>12</b><small>启用中的订阅规则</small></article><article><label>通知渠道</label><b>4</b><small>已启用渠道</small></article><article><label>自动化处置</label><b>8</b><small>今日成功执行</small></article></section>
